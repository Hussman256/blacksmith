# Render Blueprint: free web service running the Discord bot.
# The free plan has no persistent disk, so set BACKUP_GITHUB_* to keep data/ across restarts,
# and point an uptime monitor at /health so the instance doesn't sleep.
services:
  - type: web
    name: blacksmith
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run bot
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MEMWAL_MODE
        value: live
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: CHANNELS
        sync: false
      - key: MEMWAL_PRIVATE_KEY
        sync: false
      - key: MEMWAL_ACCOUNT_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: BACKUP_GITHUB_REPO
        sync: false
      - key: BACKUP_GITHUB_TOKEN
        sync: false
