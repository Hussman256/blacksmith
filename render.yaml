# Render Blueprint: Starter web service running the Discord bot, with a persistent disk for data/.
# Starter instances don't sleep, so no uptime monitor is needed. Render stops the old instance
# before starting a new one when a disk is attached, so deploys never cause double replies.
# (On the free plan instead: remove `disk`, set plan: free, and set BACKUP_GITHUB_* to keep data/.)
services:
  - type: web
    name: blacksmith
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run bot
    healthCheckPath: /health
    disk:
      name: blacksmith-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: MEMWAL_MODE
        value: live
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: CHANNELS
        sync: false
      - key: MEMWAL_PRIVATE_KEY
        sync: false
      - key: MEMWAL_ACCOUNT_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
